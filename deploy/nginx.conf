# Nginx site for the ERP. setup_server.sh replaces __DOMAIN__ and certbot adds
# the HTTPS (port 443) settings to the installed copy.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Bills/receipts are limited to 5 MB by the app; allow some headroom.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # Overwrite (not append) so the audit log records the real client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
