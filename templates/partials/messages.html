{% if messages %}
<div class="no-print mb-6 space-y-2">
  {% for message in messages %}
  <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-navy-100 bg-navy-50 text-navy-800{% endif %}" role="alert">
    <i data-lucide="{% if message.tags == 'error' %}circle-alert{% elif message.tags == 'warning' %}triangle-alert{% elif message.tags == 'success' %}circle-check{% else %}info{% endif %}" class="mt-0.5 h-4 w-4 shrink-0"></i>
    <div class="flex-1">{{ message }}</div>
    <button type="button" class="opacity-60 hover:opacity-100" data-dismiss aria-label="Dismiss"><i data-lucide="x" class="h-4 w-4"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
